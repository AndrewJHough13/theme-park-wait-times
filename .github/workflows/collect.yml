name: collect-wait-times
on:
  schedule:
    # Every 30 min, 11:00-04:59 UTC (covers 7am-11pm Eastern in EDT and EST).
    # collector.py does the exact Eastern-time gating.
    - cron: "*/30 11-23,0-4 * * *"
  workflow_dispatch: {}   # manual run button

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests "psycopg[binary]"
      - run: python collector.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
